server {
    listen 80;
    server_name reklam.hubservis.uz _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Auth endpoints
    location /auth/ {
        proxy_pass http://127.0.0.1:5000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generated Output files (videos)
    location /output/ {
        proxy_pass http://127.0.0.1:5000/output/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Uploaded media files
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Musiqa uslubi namunalari (Studio'da oldindan eshitish uchun)
    location /music-previews/ {
        proxy_pass http://127.0.0.1:5000/music-previews/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend Static Build
    location / {
        root /home/gvazar/reklama/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
